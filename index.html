<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aktien-Sim (Spielgeld)</title>
<style>
:root{--bg:#0b0d12;--card:#161a22;--card2:#1c212b;--line:#2a3140;--t:#f2f4f7;--t2:#9aa3af;--g:#3ee08a;--r:#ff5d5d;--a:#f5c542;
--gdim:rgba(62,224,138,.14);--rdim:rgba(255,93,93,.14);--adim:rgba(245,197,66,.14);--radius:16px;--radius-sm:12px;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:#9ecbff}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -16px 14px;
 padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
.sim{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;background:var(--a);color:#111;border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:7px}
#upd{font-variant-numeric:tabular-nums;color:var(--t2);font-size:12px;white-space:nowrap}
.small{font-size:12.5px;color:var(--t2)}.up{color:var(--g)}.down{color:var(--r)}
.alerts{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}.alerts:empty{display:none;margin:0}
.alert{border-radius:14px;padding:11px 14px;font-weight:700;font-size:14px;line-height:1.4}
.alert small{display:block;font-weight:500;margin-top:2px;opacity:.9}
.alert.stop{background:var(--rdim);border:1px solid rgba(255,93,93,.45);color:#ffd6d6}
.alert.pause{background:var(--adim);border:1px solid rgba(245,197,66,.5);color:#ffe7a8}
.overview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px 6px;margin:0 0 12px}
.ov-total,.ov-row{display:grid;grid-template-columns:1fr auto;align-items:end;gap:1px 12px;width:100%}
.ov-total{border-bottom:1px solid var(--line);margin:0 6px 4px;padding:16px 10px 14px;width:auto}
.ov-total .ov-name{grid-column:1/span 2;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--t2);font-weight:650}
.ov-total .ov-bal{grid-column:1;grid-row:2;font-size:30px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.ov-total .ov-pct{justify-self:end;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;grid-column:2;grid-row:2}
.ov-total .ov-sub{grid-column:1/span 2;font-size:12px;color:var(--t2);margin-top:6px;font-variant-numeric:tabular-nums}
.ov-row{appearance:none;-webkit-appearance:none;background:transparent;border:0;border-radius:12px;color:inherit;text-align:left;cursor:pointer;font:inherit;padding:10px 12px;-webkit-tap-highlight-color:transparent}
.ov-row:active{background:var(--card2)}
.ov-row .ov-name{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-open{justify-self:end;font-size:12px;color:var(--t2);font-weight:500;align-self:center;white-space:nowrap}
.ov-row .ov-bal{font-size:19px;font-weight:730;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.ov-row .ov-pct{justify-self:end;font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums;grid-column:2;grid-row:2}
.ov-row.dead{opacity:.5}
.ampel{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--t2)}
.ampel.ok{background:var(--g);box-shadow:0 0 0 3px var(--gdim)}.ampel.pause{background:var(--a);box-shadow:0 0 0 3px var(--adim)}.ampel.stop{background:var(--r);box-shadow:0 0 0 3px var(--rdim)}
.lev{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 5px;background:#262c38;color:var(--t2)}
.lev.hi{background:var(--adim);color:var(--a)}
.hint{font-size:12px;color:var(--t2);text-align:center;margin:-2px 0 16px}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.mk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.mk .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:650;white-space:nowrap}
.mk b{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .s{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.oc{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px}.oc.on{background:var(--gdim);color:var(--g)}.oc.off{background:#262c38;color:var(--t2)}
.trend{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 5px}.trend.ok{background:var(--gdim);color:var(--g)}.trend.no{background:var(--rdim);color:var(--r)}
.sect{font-size:12px;color:var(--t2);font-weight:650;letter-spacing:.04em;text-transform:uppercase;margin:20px 4px 8px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 10px;overflow:hidden;scroll-margin-top:62px}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:2px;font-weight:650;font-size:15.5px;min-height:54px;-webkit-tap-highlight-color:transparent}
details.sec>summary::-webkit-details-marker,details.sub>summary::-webkit-details-marker{display:none}
details.sec>summary .nm{grid-column:1;grid-row:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sec>summary:after{content:'▸';color:var(--t2);font-size:14px;grid-column:2;grid-row:1/span 2}
details.sec[open]>summary:after{content:'▾'}
details.sec>summary .small{font-weight:400;grid-column:1;grid-row:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
details.sec>.in{padding:0 16px 16px}
details.sub{border-top:1px solid var(--line);margin-top:10px}
details.sub>summary{list-style:none;cursor:pointer;padding:11px 0 5px;font-size:13.5px;color:var(--t2);font-weight:650;min-height:38px}
details.sub>summary:before{content:'▸ '}details.sub[open]>summary:before{content:'▾ '}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 0 6px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;min-width:0}
.kpi .l{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bar{height:6px;background:#242830;border-radius:6px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;vertical-align:1px}
.tag.l{background:var(--gdim);color:var(--g)}.tag.s{background:var(--adim);color:var(--a)}.tag.x{background:var(--rdim);color:var(--r)}.tag.n{background:#262c38;color:var(--t2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 5px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}th{color:var(--t2);font-weight:650;font-size:11px}
.r{text-align:right;white-space:nowrap}
.ev{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.ev:last-child{border:0}
.scroll{max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch}
.rules{font-size:13px;line-height:1.5}.rules b{color:var(--t)}
svg{width:100%;height:auto;display:block}
.note{font-size:12px;color:var(--t2);text-align:center;margin:20px 0 8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="wrap">
<div class="top"><h1>Aktien-Sim<span class="sim">SPIELGELD</span></h1><div id="upd">Lade …</div></div>
<div id="app"><div class="overview" style="padding:18px">Lade Daten …</div></div>
<div class="note">Spielgeld-Simulation · keine echten Trades · keine Anlageberatung · nur Lesen</div>
</div>
<script>
const GIST='https://gist.githubusercontent.com/g7fbz9c5cc-coder/cb40487bad5f5f4cda3874f13257dd46/raw/state.json';
let S=null;const OPEN=new Set();
const f2=(x,d=2)=>x==null||isNaN(x)?'–':Number(x).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=(x,d=2)=>x==null?'–':(x<0?'−':'')+'$'+f2(Math.abs(x),d);
const pct=(x,d=2)=>x==null||isNaN(x)?'–':(x>0?'+':x<0?'−':'')+f2(Math.abs(x),d)+' %';
const cls=x=>x>0?'up':(x<0?'down':'');
const td=t=>t?new Date(t).toLocaleDateString('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit'}):'–';
const tm=t=>{if(!t)return'–';const d=typeof t==='number'?new Date(t*1000):new Date(t);return d.toLocaleString('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#58a6ff','#3fb950','#f0883e','#d2a8ff','#ffd866','#ff7b72','#79c0ff','#56d364','#e3b341','#bc8cff','#ffa198','#a5d6ff','#7ee787','#ffab70','#f778ba','#c9d1d9'];
const cur=c=>c==='EUR'?'€':'$';
const levTag=b=>{const m=Math.max(0,...Object.values(b.positions||{}).map(p=>p.lev||1));return m>b.leverage?`<span class="lev hi">${f2(b.leverage,1)}x · alt ${f2(m,1)}x</span>`:`<span class="lev">${f2(b.leverage,1)}x</span>`};
const IDX={'SPY':'S&P 500','^GDAXI':'DAX'};const MK={US:'US-Börse',XETRA:'XETRA',METALS:'Gold/Silber'};
function multi(series,base,death,W=700,H=220,label=true){const all=series.flatMap(s=>s.h);if(all.length<2)return '<div class="mut">Kurven erscheinen nach ein paar Zyklen.</div>';
 const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]).concat([base]).concat(death?[death]:[]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),ry=(y1-y0)||1;
 const X=x=>(x-x0)/((x1-x0)||1)*W,Y=y=>H-8-(y-y0)/ry*(H-16);let o=`<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${Y(base)}" y2="${Y(base)}" stroke="#555" stroke-dasharray="4"/>`;
 if(death)o+=`<line x1="0" x2="${W}" y1="${Y(death)}" y2="${Y(death)}" stroke="#f85149" stroke-dasharray="6"/>`;
 for(const s of series){if(s.h.length<1)continue;const pts=(s.h.length==1?[s.h[0],[x1,s.h[0][1]]]:s.h).map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');o+=`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dead?'stroke-dasharray="3"':''} points="${pts}"/>`}
 o+='</svg>';if(label)o+=`<div class="mut">grau gestrichelt = ${f2(base,0)} $ Start${death?' · rot = '+f2(death,0)+' $ Todeslinie':''} · ${f2(y0,0)} – ${f2(y1,0)} $</div>`;return o}

function sec(k,title,sub,inner){return `<details class="sec" data-k="${k}"${OPEN.has(k)?' open':''}><summary><span class="nm">${title}</span><span class="small">${sub||''}</span></summary><div class="in">${inner}</div></details>`}
function sub(k,title,inner){return `<details class="sub" data-k="${k}"${OPEN.has(k)?' open':''}><summary>${title}</summary><div>${inner}</div></details>`}
function posRows(s,b){const P=Object.entries(b.positions||{});if(!P.length)return '<div class="small" style="padding:6px 0">Keine offenen Positionen.</div>';
 let o='<table><tr><th>Wert</th><th class="r">Einstieg → jetzt</th><th class="r">G/V</th></tr>';
 for(const[k,p] of P){const lp=((s.last_prices||{})[k]||{}).price;const sh=p.side==='SHORT';const pc=lp?(lp/p.entry-1)*100*(sh?-1:1):null;const lv=p.lev||1;
  o+=`<tr><td><span class="tag ${sh?'s':'l'}">${sh?'Short':'Long'}</span> <b>${esc(p.name||k)}</b>${lv>1?` <span class="lev ${lv>1.5?'hi':''}">${f2(lv,1)}x</span>`:''}<br><span class="small">${esc(k)} · seit ${td(p.opened)}</span></td>
  <td class="r">${f2(p.entry)}<br><span class="small">${f2(lp)} ${cur(p.cur)}</span></td><td class="r ${cls(pc)}"><b>${pct(pc)}</b>${lv>1&&pc!=null?`<br><span class="small">${pct(pc*lv,1)} Einsatz</span>`:''}</td></tr>`}
 return o+'</table>'}
function tradeRows(T,showBot){if(!T.length)return '<div class="small" style="padding:6px 0">Noch keine Trades.</div>';let o='<table>';
 for(const t of T){const closing=t.pnl_pct!=null;const side={KAUF:'Kauf',VERKAUF:'Verkauf',SHORT:'Short',DECKUNG:'Deckung'}[t.side]||t.side;
  o+=`<tr><td style="white-space:nowrap"><span class="small">${tm(t.ts)}</span></td><td>${showBot?`<b>${esc(t.bot_name)}</b> · `:''}<span class="tag ${t.margin_call?'x':(t.side==='KAUF'?'l':t.side==='SHORT'?'s':'n')}">${t.margin_call?'Margin-Call':side}</span> ${esc(t.name)}${(t.lev||1)>1?` <span class="lev ${(t.lev||1)>1.5?'hi':''}">${f2(t.lev,1)}x</span>`:''}<br><span class="small">${esc(t.why)}</span></td>
  <td class="r">${closing?`<b class="${cls(t.pnl_usd)}">${pct(t.pnl_pct,1)}</b><br><span class="small ${cls(t.pnl_usd)}">${usd(t.pnl_usd)}</span>`:`<span class="small">${usd(t.usd,0)}</span>`}</td></tr>`}
 return o+'</table>'}
function render(){const s=S;const R=s.rules||{};const DEATH=R.death||5000;const now=Date.now();
 const age=(now-new Date(s.last_cycle))/60000;
 const B=[...(s.bots||[])].sort((a,b)=>(b.alive-a.alive)||(b.equity-a.equity));const alive=B.filter(b=>b.alive);const byId={};B.forEach(b=>{byId[b.id]=b;b.col=COL[(b.id-1)%COL.length]});
 const sumE=alive.reduce((a,b)=>a+(b.equity||0),0),sumCash=alive.reduce((a,b)=>a+(b.cash||0),0);
 const funded=B.reduce((a,b)=>a+(b.start_money||0),0),deadRest=B.filter(b=>!b.alive).reduce((a,b)=>a+(b.equity||0),0);
 const pnl=sumE+deadRest-funded,pnlp=funded?pnl/funded*100:0,nDead=B.length-alive.length;
 const nOpen=alive.reduce((a,b)=>a+Object.keys(b.positions||{}).length,0);
 const RS=(R.regime||{}).status||{};
 document.getElementById('upd').textContent='Stand: '+new Date(s.published_at||s.last_cycle).toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin'})+' MEZ';
 // Warnungen
 let al='';
 if(s._cached)al+=`<div class="alert pause">Zuletzt gespeicherte Daten<small>Neue Daten kommen gerade nicht an – Anzeige vom ${tm(s.published_at)}.</small></div>`;
 if(age>15)al+=`<div class="alert stop">⚠️ Daten veraltet<small>Letzter Rechenzyklus vor ${f2(age,0)} Min (${tm(s.last_cycle)}).</small></div>`;
 for(const k of ['US','XETRA']){const g=RS[k];if(g&&!g.ok)al+=`<div class="alert pause">📉 Marktfilter ${MK[k]}: keine neuen Käufe<small>${IDX[g.sym]||esc(g.sym)} ${f2(g.close)} unter ${g.sma_n}-Tage-Schnitt ${f2(g.sma)} (Schluss ${esc((g.day||'').split('-').reverse().slice(0,2).join('.'))}.)${g.stale?' · Indexdaten nicht aktuell':''} · Shorts erlaubt</small></div>`}
 for(const[k,v] of Object.entries(s.event_block||{}))if(v)al+=`<div class="alert pause">⏸ ${MK[k]||esc(k)}: Termin-Pause<small>${esc(v)}</small></div>`;
 for(const b of alive){const d=b.equity-DEATH;if(d<1500)al+=`<div class="alert stop">☠️ ${esc(b.name)} nahe der Todeslinie<small>${usd(b.equity)} – nur noch ${usd(d,0)} über ${usd(DEATH,0)}.</small></div>`}
 let o=`<div class="alerts">${al}</div>`;
 // Übersicht
 o+=`<div class="overview"><div class="ov-total"><span class="ov-name">Gesamt</span><span class="ov-bal">${usd(sumE+deadRest)}</span><span class="ov-pct ${cls(pnl)}">${pct(pnlp)}</span>
 <span class="ov-sub">${usd(pnl)} ggü. ${usd(funded,0)} Start · ${alive.length} Bots${nDead?` (${nDead} tot)`:''} · ${nOpen} Positionen offen · Bargeld ${usd(sumCash,0)}</span></div>`;
 for(const b of B){const d=b.equity-DEATH;const st=!b.alive?'stop':(d<2500?'pause':'ok');const n=Object.keys(b.positions||{}).length;
  o+=`<button class="ov-row${b.alive?'':' dead'}" data-go="bot-${b.id}"><span class="ov-name"><span class="ampel ${st}"></span>${b.alive?'':'† '}${esc(b.name)}</span><span class="ov-open">${n} offen · ${levTag(b)}</span><span class="ov-bal">${usd(b.equity)}</span><span class="ov-pct ${cls(b.pnl_pct)}">${pct(b.pnl_pct)}</span></button>`}
 o+='</div><div class="hint">Tippe auf einen Bot für die Details.</div>';
 // Markt-Leiste
 const LP=s.last_prices||{},M=s.markets||{};
 const idxCard=(k)=>{const g=RS[k];const open=(M[k]||{}).open;return `<div class="mk"><div class="h">${g?IDX[g.sym]||esc(g.sym):MK[k]} <span class="oc ${open?'on':'off'}">${open?'offen':'zu'}</span></div>${g?`<b>${f2(g.close)}</b><div class="s"><span class="trend ${g.ok?'ok':'no'}">${g.ok?'▲ über':'▼ unter'} SMA${g.sma_n}</span> ${f2(g.sma,0)}</div>`:'<b>–</b><div class="s">kein Filter</div>'}</div>`};
 const metal=(sym,nm)=>{const q=LP[sym]||{};const ch=q.prev_close?(q.price/q.prev_close-1)*100:null;const open=(M.METALS||{}).open;return `<div class="mk"><div class="h">${nm} <span class="oc ${open?'on':'off'}">${open?'offen':'zu'}</span></div><b>$${f2(q.price)}</b><div class="s"><span class="${cls(ch)}">${pct(ch)}</span> zum Vortag</div></div>`};
 o+=`<div class="strip">${idxCard('US')}${idxCard('XETRA')}${metal('GC=F','Gold')}${metal('SI=F','Silber')}</div>`;
 // Bot-Abschnitte
 o+='<div class="sect">Bots</div>';
 const T=s.trades||[],D=s.decisions||[];
 for(const b of B){const n=Object.keys(b.positions||{}).length;const d=b.equity-DEATH;const bar=Math.max(0,Math.min(100,d/(b.start_money-DEATH)*50));
  const inv=(b.equity||0)-(b.cash||0);
  let x=`<div class="kpis"><div class="kpi"><div class="l">Konto</div><b>${usd(b.equity,0)}</b></div><div class="kpi"><div class="l">Bargeld</div><b>${usd(b.cash,0)}</b></div><div class="kpi"><div class="l">Engagement</div><b>${usd(b.exposure,0)}</b></div>
  <div class="kpi"><div class="l">Trades</div><b>${b.closed_trades}</b></div><div class="kpi"><div class="l">Treffer</div><b>${b.win_rate==null?'–':f2(b.win_rate,0)+' %'}</b></div><div class="kpi"><div class="l">Hebel</div><b>${f2(b.leverage,1)}x</b></div></div>
  <div class="small">${b.alive?`${usd(d,0)} über der Todeslinie (${usd(DEATH,0)})`:`gestorben ${tm(b.died_at)}: ${esc(b.death_reason)}`}</div><div class="bar"><i style="width:${bar}%;background:${d<1500?'var(--r)':(d<2500?'var(--a)':'var(--g)')}"></i></div>
  ${multi([{h:b.equity_history||[],c:b.col}],b.start_money,null,600,110,false)}
  <div class="small" style="margin:12px 0 2px;font-weight:650">Offene Positionen (${n})</div>${posRows(s,b)}`;
  x+=sub('t-'+b.id,'Letzte Trades',tradeRows(T.filter(t=>t.bot===b.id).slice(0,8),false));
  const bd=D.filter(e=>e.bot===b.id).slice(0,6);
  x+=sub('d-'+b.id,'Letzte Entscheidungen',bd.length?bd.map(e=>`<div class="ev"><span class="small">${tm(e.ts)}</span> <b>${esc(e.action)}</b> ${esc(e.sym)}<br><span class="small">${esc(e.why)}</span></div>`).join(''):'<div class="small">Keine.</div>');

 const C=R.costs||{},EV=R.events||{},LV=R.leverage||{},RG=(R.regime||{}).cfg||{};

 <b>Short</b><br>• nur Bots mit Short-Gen · Stop oberhalb Einstieg · Leihgebühr ${f2((R.short?.borrow_rate||0.03)*100,0)} % p.a.<br>
 <b>Handel</b><br>• <b>Marktfilter:</b> neue Long-Käufe nur, wenn der Index am Vortag über seinem ${RG.sma||50}-Tage-Schnitt schloss (US: S&amp;P 500, XETRA: DAX) · Shorts und Gold/Silber ohne Filter<br>
 • Signal-Ausstiege erst ab dem Tag nach dem Kauf · Stop-Loss und Margin-Call sofort<br>
 • Keine neuen Einstiege ${EV.block_minutes_before} Min vor bis ${EV.block_minutes_after} Min nach wichtigen Terminen<br>
 • Kosten ${usd(C.fee_usd)} je Trade + ${f2((C.slippage_pct||0)*100)} % Schlupf · Yahoo-Kurse (bis ~15 Min verzögert), Signale auf Tagesschlusskursen<br>
 • Keine echten Trades, kein echtes Geld, keine Anlageberatung</div>`);
 o+=`<div class="note">Start ${tm(s.started_at)} · Zyklus ${s.cycles} · letzter Zyklus ${tm(s.last_cycle)}<br>aktualisiert sich jede Minute</div>`;

 app.querySelectorAll('details[data-k]').forEach(d=>d.addEventListener('toggle',()=>{d.open?OPEN.add(d.dataset.k):OPEN.delete(d.dataset.k)}));

async function load(){let d=null;try{const r=await fetch(GIST+'?t='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}
 if(d&&d.bots&&d.bots.length){S=d;try{localStorage.setItem('stocksim_last',JSON.stringify(d))}catch(e){}render();return}
 if(!S){try{const c=JSON.parse(localStorage.getItem('stocksim_last')||'null');if(c&&c.bots){c._cached=true;S=c;render();return}}catch(e){}
  document.getElementById('app').innerHTML='<div class="overview" style="padding:18px">Daten kommen gerade nicht an – gleich nochmal versuchen.</div>'}else if(!S._cached){S._cached=true;render()}}
load();setInterval(load,60000);
